[project]
name = "app-backend"
version = "1.1.0"
description = "FastAPI backend with file-based storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

# === [DEMO-07] Backend Linter (Ruff), Formatter & Type Checker (Mypy) ===
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["app", "test_api.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

